# ============================================================
# GLOBAL SETTINGS
# ============================================================

# Keep NGINX in the foreground.
# This allows our Python startup script to monitor and manage its process.
daemon off;

# Use a single worker process for this local development setup.
worker_processes 1;

# Store the NGINX process ID inside the repository.
pid logs/nginx.pid;

# Store NGINX errors and startup/configuration messages here.
error_log logs/error.log warn;


# ============================================================
# CONNECTION SETTINGS
# ============================================================

events {
    # Maximum simultaneous connections handled by a worker.
    worker_connections 1024;
}


# ============================================================
# HTTP CONFIGURATION
# ============================================================

http {
    # Store incoming request logs here.
    access_log logs/access.log;

    # Hide the NGINX version in HTTP response headers.
    server_tokens off;

    # --------------------------------------------------------
    # SERVER BLOCK 1: HTTP (PORT 80)
    # --------------------------------------------------------

    server {
        # Listen on the IPv4 and IPv6 loopback interfaces.
        # This keeps the development server accessible only
        # from this machine.
        listen 127.0.0.1:80;
        listen [::1]:80;

        # Accept requests addressed to localhost or 127.0.0.1.
        server_name localhost 127.0.0.1;

        # Redirect HTTP requests to HTTPS.
        # 308 preserves the original HTTP method and request body.
        # Example:
        # http://localhost/posts
        # becomes:
        # https://localhost/posts

        return 308 https://$host$request_uri;
    }


    # --------------------------------------------------------
    # SERVER BLOCK 2: HTTPS (PORT 443)
    # --------------------------------------------------------

    server {
        # Listen for HTTPS connections on loopback interfaces.
        listen 127.0.0.1:443 ssl;
        listen [::1]:443 ssl;

        server_name localhost 127.0.0.1;

        # ----------------------------------------------------
        # SSL / TLS CERTIFICATE CONFIGURATION
        # ----------------------------------------------------

        # Public certificate generated using mkcert.
        ssl_certificate ../certs/localhost.pem;

        # Corresponding private key.
        ssl_certificate_key ../certs/localhost-key.pem;

        # Permit modern TLS versions.
        ssl_protocols TLSv1.2 TLSv1.3;

        # ----------------------------------------------------
        # REVERSE PROXY CONFIGURATION
        # ----------------------------------------------------

        # Forward every incoming path to our single Uvicorn
        # instance running on localhost:8000.
        location / {
            # Forward requests to the Uvicorn server running on localhost:8000.
            proxy_pass http://127.0.0.1:8000;

            # Use HTTP/1.1 for communication with Uvicorn.
            proxy_http_version 1.1;

            # Preserve the original hostname.
            proxy_set_header Host $host;

            # Forward the original client's IP address.
            proxy_set_header X-Real-IP $remote_addr;

            # Preserve the forwarded client IP information.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Inform FastAPI/Uvicorn that the original request
            # arrived over HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
